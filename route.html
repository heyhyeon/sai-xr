<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>도착까지 15분 | 사이 SAI</title><link rel="stylesheet" href="subpages.css"></head><body data-page="route"><div class="cover" style="background-image:url('assets/passing-fields.jpg')"></div><div class="shade"></div><nav><a class="back" href="index.html#solo">← 사이로 돌아가기</a></nav><main class="shell fade-enter"><span class="eye">04 / TIMELINE · XR TRAVEL</span><h1 class="title" data-edit-key="title">도착까지 15분</h1><p class="intro" data-edit-key="intro">기차의 시간은 계속 흐릅니다. 무료 여행은 이벤트 역에 잠시 정차하고, 내릴지 계속 갈지는 이용자가 선택합니다.</p><div class="panel"><div class="two"><div><span class="eye">TRAVEL TIMELINE</span><h2 data-edit-key="route-heading" id="stopTitle">출발합니다</h2><p class="muted" id="stopDesc">도시의 불빛이 뒤로 멀어집니다.</p></div><div><span class="eye">VIRTUAL TIME</span><div class="time" id="clock">04:32</div><p class="muted" id="left">도착까지 15분</p></div></div><div class="mini-route" id="stops"></div><label for="scrub">여행 시간 움직이기</label><input id="scrub" type="range" min="0" max="15" value="0"><img class="preview" id="routePhoto" src="assets/passing-fields.jpg" alt="현재 여정의 풍경" style="margin-top:26px"></div><div class="controls"><button class="btn" id="editCopy" aria-pressed="false">문구 편집</button></div><p class="notice" id="notice" role="status"></p><footer>THE DAWN SEA TRAIN · INTERACTIVE CONCEPT ONLY · NO LIVE SERVICE</footer></main><script>
const $=s=>document.querySelector(s);const $$=s=>[...document.querySelectorAll(s)];
function msg(v){$('#notice').textContent=v}
const name=document.body.dataset.page;
const editKey='dawn-subpage-'+name;
const elems=$$('[data-edit-key]');
try{const saved=JSON.parse(localStorage.getItem(editKey)||'{}');elems.forEach(e=>{if(typeof saved[e.dataset.editKey]==='string')e.innerHTML=saved[e.dataset.editKey]})}catch{}
$('#editCopy').onclick=()=>{const enabled=$('#editCopy').getAttribute('aria-pressed')!=='true';$('#editCopy').setAttribute('aria-pressed',enabled);elems.forEach(e=>e.contentEditable=String(enabled));$('#editCopy').textContent=enabled?'문구 편집 완료':'문구 편집';if(!enabled){try{localStorage.setItem(editKey,JSON.stringify(Object.fromEntries(elems.map(e=>[e.dataset.editKey,e.innerHTML]))))}catch{}msg('문구를 저장했어요.')}};

const stops=[{n:0,t:'04:32',name:'출발',desc:'도시의 불빛이 뒤로 멀어집니다.',img:'passing-fields.jpg'},{n:3,t:'04:35',name:'교외',desc:'익숙한 건물 대신 들판이 나타납니다.',img:'mist-landscape.jpg'},{n:7,t:'04:39',name:'이벤트 역',desc:'기차가 정차합니다. 우동집에 내리는 것은 선택입니다.',img:'weather-rain.jpg'},{n:11,t:'04:43',name:'해안선',desc:'먼 바다가 창밖으로 보이기 시작합니다.',img:'weather-clear.jpg'},{n:15,t:'04:47',name:'새벽바다',desc:'기차가 목적지에 도착했습니다.',img:'arrival-clean.jpg'}];
$('#stops').innerHTML=stops.map((s,i)=>`<button data-index="${i}" aria-pressed="false">${s.t}<br>${s.name}</button>`).join('');
function draw(n){n=Number(n);const m=32+n;$('#clock').textContent='04:'+String(m).padStart(2,'0');$('#left').textContent='도착까지 '+(15-n)+'분';const active=stops.filter(s=>s.n<=n).at(-1);$('#stopTitle').textContent=active.name;$('#stopDesc').textContent=active.desc;$('#routePhoto').src='assets/'+active.img;$$('[data-index]').forEach((b,i)=>b.setAttribute('aria-pressed',String(stops[i]===active)));$('#scrub').value=n}
$$('[data-index]').forEach(b=>b.onclick=()=>draw(stops[Number(b.dataset.index)].n));$('#scrub').oninput=e=>draw(e.target.value);draw(0);
</script></body></html>
