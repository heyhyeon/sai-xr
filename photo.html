<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>창밖의 한 장 | 사이 SAI</title><link rel="stylesheet" href="subpages.css"></head><body data-page="photo"><div class="cover" style="background-image:url('assets/weather-clear.jpg')"></div><div class="shade"></div><nav><a class="back" href="index.html#solo">← 사이로 돌아가기</a></nav><main class="shell fade-enter"><span class="eye">02 / CAMERA · XR TRAVEL</span><h1 class="title" data-edit-key="title">창밖의 한 장</h1><p class="intro" data-edit-key="intro">기차가 지나가는 순간을 한 장의 사진으로 남깁니다. 장면을 선택하고, 촬영하면 사진을 저장할 수 있습니다.</p><div class="panel"><h2 data-edit-key="photo-heading">여행 사진관</h2><p class="muted">장면을 선택하고 촬영을 눌러보세요. 이미지 안에는 글자를 넣지 않습니다.</p><div class="photo-frame"><img id="photoPreview" src="assets/weather-clear.jpg" alt="창밖 맑은 바다 풍경"></div><div class="photogrid"><button data-photo="weather-clear.jpg" aria-pressed="true" aria-label="맑은 바다"><img src="assets/weather-clear.jpg" alt="맑음"></button><button data-photo="weather-rain.jpg" aria-pressed="false" aria-label="비 오는 바다"><img src="assets/weather-rain.jpg" alt="비"></button><button data-photo="weather-snow.jpg" aria-pressed="false" aria-label="눈 내리는 바다"><img src="assets/weather-snow.jpg" alt="눈"></button></div><div class="controls"><button class="btn primary" id="capture">▣ 사진 찍고 저장하기</button></div></div><div class="controls"><button class="btn" id="editCopy" aria-pressed="false">문구 편집</button></div><p class="notice" id="notice" role="status"></p><footer>THE DAWN SEA TRAIN · INTERACTIVE CONCEPT ONLY · NO LIVE SERVICE</footer></main><script>
const $=s=>document.querySelector(s);const $$=s=>[...document.querySelectorAll(s)];
function msg(v){$('#notice').textContent=v}
const name=document.body.dataset.page;
const editKey='dawn-subpage-'+name;
const elems=$$('[data-edit-key]');
try{const saved=JSON.parse(localStorage.getItem(editKey)||'{}');elems.forEach(e=>{if(typeof saved[e.dataset.editKey]==='string')e.innerHTML=saved[e.dataset.editKey]})}catch{}
$('#editCopy').onclick=()=>{const enabled=$('#editCopy').getAttribute('aria-pressed')!=='true';$('#editCopy').setAttribute('aria-pressed',enabled);elems.forEach(e=>e.contentEditable=String(enabled));$('#editCopy').textContent=enabled?'문구 편집 완료':'문구 편집';if(!enabled){try{localStorage.setItem(editKey,JSON.stringify(Object.fromEntries(elems.map(e=>[e.dataset.editKey,e.innerHTML]))))}catch{}msg('문구를 저장했어요.')}};

let activePhoto='weather-clear.jpg';$$('[data-photo]').forEach(b=>b.onclick=()=>{activePhoto=b.dataset.photo;$('#photoPreview').src='assets/'+activePhoto;$$('[data-photo]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))});
$('#capture').onclick=()=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;const ctx=c.getContext('2d');ctx.drawImage(img,0,0);c.toBlob(blob=>{const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download='새벽바다행_여행사진.png';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);msg('글자가 없는 여행 사진을 저장했어요.')},'image/png')};img.src='assets/'+activePhoto};
</script></body></html>
