<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>창가의 음악 | 사이 SAI</title><link rel="stylesheet" href="subpages.css"></head><body data-page="music"><div class="cover" style="background-image:url('assets/weather-rain.jpg')"></div><div class="shade"></div><nav><a class="back" href="index.html#solo">← 사이로 돌아가기</a></nav><main class="shell fade-enter"><span class="eye">01 / MUSIC · XR TRAVEL</span><h1 class="title" data-edit-key="title">창가의 음악</h1><p class="intro" data-edit-key="intro">기차 안에 작은 음악 공간을 펼칩니다. 빗소리와 멜로디의 크기를 조절하고, 때로는 아무 소리 없이 창밖을 바라봅니다.</p><div class="panel"><h2 data-edit-key="music-heading">오늘의 플레이리스트</h2><p class="muted" data-edit-key="music-desc">아래 소리는 시연을 위한 간단한 오리지널 앰비언트 사운드입니다. 외부 음원이나 스트리밍 서비스와 연결되지 않습니다.</p><div class="controls"><button id="play" class="btn primary" aria-pressed="false">▶ 재생</button><button id="stop" class="btn">■ 정지</button></div><div class="two" style="margin-top:24px"><div><label for="melody">음악 볼륨</label><input id="melody" type="range" min="0" max="100" value="22"></div><div><label for="ambience">빗소리 볼륨</label><input id="ambience" type="range" min="0" max="100" value="32"></div></div></div><div class="controls"><button class="btn" id="editCopy" aria-pressed="false">문구 편집</button></div><p class="notice" id="notice" role="status"></p><footer>THE DAWN SEA TRAIN · INTERACTIVE CONCEPT ONLY · NO LIVE SERVICE</footer></main><script>
const $=s=>document.querySelector(s);const $$=s=>[...document.querySelectorAll(s)];
function msg(v){$('#notice').textContent=v}
const name=document.body.dataset.page;
const editKey='dawn-subpage-'+name;
const elems=$$('[data-edit-key]');
try{const saved=JSON.parse(localStorage.getItem(editKey)||'{}');elems.forEach(e=>{if(typeof saved[e.dataset.editKey]==='string')e.innerHTML=saved[e.dataset.editKey]})}catch{}
$('#editCopy').onclick=()=>{const enabled=$('#editCopy').getAttribute('aria-pressed')!=='true';$('#editCopy').setAttribute('aria-pressed',enabled);elems.forEach(e=>e.contentEditable=String(enabled));$('#editCopy').textContent=enabled?'문구 편집 완료':'문구 편집';if(!enabled){try{localStorage.setItem(editKey,JSON.stringify(Object.fromEntries(elems.map(e=>[e.dataset.editKey,e.innerHTML]))))}catch{}msg('문구를 저장했어요.')}};

let ac, osc=[], nodes=[], musicGain, rainGain;
function stopAudio(){if(ac){ac.close();ac=null}osc=[];nodes=[];$('#play').setAttribute('aria-pressed','false');$('#play').textContent='▶ 재생'}
$('#stop').onclick=stopAudio;
$('#play').onclick=()=>{if(ac){stopAudio();return}try{ac=new (window.AudioContext||window.webkitAudioContext)();musicGain=ac.createGain();musicGain.gain.value=Number($('#melody').value)/400;musicGain.connect(ac.destination);for(const f of [164.81,220,261.63,329.63]){const o=ac.createOscillator();const g=ac.createGain();o.type='sine';o.frequency.value=f;g.gain.value=.18;o.connect(g);g.connect(musicGain);o.start();osc.push(o)}rainGain=ac.createGain();rainGain.gain.value=Number($('#ambience').value)/300;const buffer=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate);const ch=buffer.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=(Math.random()*2-1)*.16;const src=ac.createBufferSource();src.buffer=buffer;src.loop=true;const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=520;src.connect(lp);lp.connect(rainGain);rainGain.connect(ac.destination);src.start();osc.push(src);$('#play').setAttribute('aria-pressed','true');$('#play').textContent='Ⅱ 일시정지';msg('앰비언트 사운드를 재생 중입니다.')}catch(e){msg('이 브라우저에서는 사운드를 재생할 수 없습니다.')}};
$('#melody').oninput=e=>{if(musicGain)musicGain.gain.value=e.target.value/400};$('#ambience').oninput=e=>{if(rainGain)rainGain.gain.value=e.target.value/300};window.addEventListener('pagehide',stopAudio);
</script></body></html>
